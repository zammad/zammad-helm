apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "zammad.fullname" . }}-helm-test-rake-task"
  labels:
    {{- include "zammad.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
data:
  helm-test.rake: |-
    namespace :zammad do
      namespace :helm do
        desc 'Runs a set of Helm tests'
        task test: :environment do |_task, args|

          {{- if .Values.zammadConfig.initJob.enabled }}
          # Helm does not wait for jobs, so make sure zammad-init completed.
          puts 'Waiting for the database initialisation to finish…'
          (started, deadline)  = Time.current, 5.minutes.from_now
          while Time.current < deadline
            break if Rails.cache.read('helm-postgresql-init-done-{{ .Release.Revision }}')
            sleep 5
          end
          if !Rails.cache.read('helm-postgresql-init-done-{{ .Release.Revision }}')
            raise 'Timed out waiting for the database initialisation to finish.'
          end
          puts "  Database initialisation has finished, waited #{(Time.current - started).round}s."
          {{- end }}

          puts 'Checking if a Ruby Tempfile can be created…'
          Tempfile.create do |_f|
            puts '  Tempfile file was created successfully.'
          end

          puts 'Checking if file can be created directly in /opt/zammad/tmp…'
          File.write('/opt/zammad/tmp/test.txt', 'test content')
          puts '  File was created in /tmp successfully.'

          {{- if .Values.zammadConfig.storageVolume.enabled }}
          puts 'Checking if storage file can be created…'
          File.write('/opt/zammad/storage/test.txt', 'test content')
          puts '  Storage file was created successfully.'
          {{- else }}
          puts 'Storage volume not enabled, not testing it…'
          {{- end }}

          {{- if and .Values.zammadConfig.elasticsearch.initialisation .Release.IsInstall }}
          puts 'Checking if the Elasticsearch host is excluded from proxy routing…'
          proxy_no = Setting.get('proxy_no')
          if proxy_no != '{{ include "zammad.elasticsearchHost" . }}'
            raise "Elasticsearch host '{{ include "zammad.elasticsearchHost" . }}' is missing from the 'proxy_no' setting (#{proxy_no})."
          end
          puts "  Elasticsearch host is excluded from proxy routing (#{proxy_no})."
          {{- end }}

        end
      end
    end
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "zammad.fullname" . }}-run-helm-test-rake-task"
  labels:
    {{- include "zammad.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  # Outlasts the wait for the database initialisation above, so that its own timeout message
  #   reaches the log instead of Kubernetes killing the pod with DeadlineExceeded first.
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "zammad.labels" . | nindent 8 }}
    spec:
        {{- include "zammad.podSpec.deployment" . | nindent 8 }}
        containers:
          - name: zammad-run-tests
            # Use securityContext etc. from railsserver to have identical setup, but not its
            #   probes: this container runs a rake task and never listens on the railsserver port,
            #   so the startup probe would always fail and kill it after failureThreshold periods.
            {{- include "zammad.containerSpec" (merge (dict "containerConfig" (omit .Values.zammadConfig.railsserver "startupProbe" "livenessProbe" "readinessProbe")) .) | nindent 12 }}
            command: ['bundle']
            args: ['exec', 'rake', 'zammad:helm:test']
            env:
              {{- include "zammad.env" . | nindent 16 }}
              {{- include "zammad.env.failOnPendingMigrations" . | nindent 16 }}
            volumeMounts:
              {{- include "zammad.volumeMounts" . | nindent 14 }}
              - name: helm-rake-test-volume
                mountPath: /opt/zammad/lib/tasks/helm
                readOnly: true
        volumes:
          {{- include "zammad.volumes" . | nindent 10 }}
          - name: helm-rake-test-volume
            configMap:
              name: "{{ include "zammad.fullname" . }}-helm-test-rake-task"
        restartPolicy: Never
