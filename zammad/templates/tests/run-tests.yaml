apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "zammad.fullname" . }}-helm-test-rake-task"
  labels:
    {{- include "zammad.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
data:
  helm-test.rake: |-
    namespace :zammad do
      namespace :helm do
        desc 'Runs a set of Helm tests'
        task test: :environment do |_task, args|

          {{- if .Values.zammadConfig.elasticsearch.initialisation }}
          # `helm install --wait` returns before the init job completes, because the job is
          #   deliberately not a Helm hook (see job-init.yaml), so this test can start while
          #   postgresql-init is still migrating and seeding. elasticsearch-init sets es_url and
          #   only runs once postgresql-init succeeded, so a present es_url means the database
          #   initialisation is done and any check below can rely on its result.
          # Setting.get caches for ZAMMAD_SETTING_TTL (15s), so force a reload on every attempt.
          puts 'Waiting for the database initialisation to finish…'
          deadline = 8.minutes.from_now
          while Time.current < deadline
            Setting.reload
            break if Setting.get('es_url').present?

            sleep 5
          end
          if Setting.get('es_url').blank?
            raise 'Timed out waiting for the database initialisation to finish.'
          end
          puts '  Database initialisation has finished.'
          {{- end }}

          puts 'Checking if a Ruby Tempfile can be created…'
          Tempfile.create do |_f|
            puts '  Tempfile file was created successfully.'
          end

          puts 'Checking if file can be created directly in /opt/zammad/tmp…'
          File.write('/opt/zammad/tmp/test.txt', 'test content')
          puts '  File was created in /tmp successfully.'

          {{- if .Values.zammadConfig.storageVolume.enabled }}
          puts 'Checking if storage file can be created…'
          File.write('/opt/zammad/storage/test.txt', 'test content')
          puts '  Storage file was created successfully.'
          {{- else }}
          puts 'Storage volume not enabled, not testing it…'
          {{- end }}

          {{- if and .Values.zammadConfig.elasticsearch.initialisation .Release.IsInstall }}
          puts 'Checking if the Elasticsearch host is excluded from proxy routing…'
          # Seed counts tell apart "db:seed never finished" from "the write itself did not happen":
          #   users appear with the 2nd seed file, overviews and schedulers near the end.
          state = "proxy_no=#{Setting.get('proxy_no').inspect}, system_init_done=#{Setting.get('system_init_done').inspect}, users=#{User.count}, overviews=#{Overview.count}, schedulers=#{Scheduler.count}"
          # Mirrors UserAgent::HttpClient#proxy_no: entries are comma separated and matched exactly.
          proxy_no = Setting.get('proxy_no').to_s.split(',').map { |entry| entry.strip.downcase }
          if proxy_no.exclude?('{{ include "zammad.elasticsearchHost" . | lower }}')
            raise "Elasticsearch host '{{ include "zammad.elasticsearchHost" . | lower }}' is missing from the 'proxy_no' setting (#{state})."
          end
          puts "  Elasticsearch host is excluded from proxy routing (#{state})."
          {{- end }}

        end
      end
    end
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "zammad.fullname" . }}-run-helm-test-rake-task"
  labels:
    {{- include "zammad.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  # Long enough to outlast the wait for the database initialisation above.
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "zammad.labels" . | nindent 8 }}
    spec:
        {{- include "zammad.podSpec.deployment" . | nindent 8 }}
        containers:
          - name: zammad-run-tests
            # Use securityContext etc. from railsserver to have identical setup.
            {{- include "zammad.containerSpec" (merge (dict "containerConfig" .Values.zammadConfig.railsserver) .) | nindent 12 }}
            command: ['bundle']
            args: ['exec', 'rake', 'zammad:helm:test']
            env:
              {{- include "zammad.env" . | nindent 16 }}
              {{- include "zammad.env.failOnPendingMigrations" . | nindent 16 }}
            volumeMounts:
              {{- include "zammad.volumeMounts" . | nindent 14 }}
              - name: helm-rake-test-volume
                mountPath: /opt/zammad/lib/tasks/helm
                readOnly: true
        volumes:
          {{- include "zammad.volumes" . | nindent 10 }}
          - name: helm-rake-test-volume
            configMap:
              name: "{{ include "zammad.fullname" . }}-helm-test-rake-task"
        restartPolicy: Never
