apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "zammad.fullname" . }}-test-connection"
  labels:
    {{- include "zammad.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  activeDeadlineSeconds: 10
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "zammad.labels" . | nindent 8 }}
    spec:
      {{- include "zammad.podSpec" . | nindent 6 }}
      containers:
        {{- with .Values.zammadConfig.helmTests.connection }}
        - name: wget
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ['wget']
          # Discard the response, the root filesystem is read-only.
          args: ['-q', '-O', '/dev/null', '{{ include "zammad.fullname" $ }}-nginx:{{ $.Values.service.port }}']
        {{- end }}
      restartPolicy: Never
