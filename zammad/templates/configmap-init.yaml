apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zammad.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zammad.labels" . | nindent 4 }}
  annotations:
    {{- include "zammad.annotations" . | nindent 4 }}
data:
  postgresql-init: |-
    #!/bin/bash
    set -e

    if ! (bundle exec rails r 'puts User.any?' 2> /dev/null | grep -q true); then
        bundle exec rake db:migrate db:seed
    else
        echo Executing migrations...
        bundle exec rake db:migrate

        echo Synchronizing locales and translations...
        bundle exec rails r "Locale.sync; Translation.sync"
    fi

    echo "postgresql init complete :)"
  postgresql-init-post: |-
    #!/bin/bash
    set -e

    # Run a rails command to ensure the database is up and running.
    bundle exec rails r "true"

    echo "init sequence complete :)"
  zammad-init: |-
    #!/bin/bash
    set -e

    {{- with .Values.zammadConfig.initContainers.zammad.customInit }}
      {{- . | nindent 4 }}
    {{- end }}

    echo "zammad init complete :)"
{{ if .Values.zammadConfig.elasticsearch.initialisation }}
  elasticsearch-init: |-
    #!/bin/bash
    set -e

    ELASTICSEARCH_URL={{ .Values.zammadConfig.elasticsearch.schema }}://{{ include "zammad.elasticsearchHost" . }}:{{ .Values.zammadConfig.elasticsearch.port }}
    bundle exec rails r "Setting.set('es_url', '${ELASTICSEARCH_URL}')"

    ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-{{ include "zammad.elasticsearchUser" . }}}
    if [ -n "${ELASTICSEARCH_USER}" ] && [ -n "${ELASTICSEARCH_PASSWORD}" ]; then
        bundle exec rails r "Setting.set('es_user', '${ELASTICSEARCH_USER}'); Setting.set('es_password', '${ELASTICSEARCH_PASSWORD}')"
    fi

  {{ if .Values.zammadConfig.elasticsearch.reindex }}
    bundle exec rake zammad:searchindex:rebuild
  {{ else }}
    echo "Checking if an elasticsearch index already exists…"

    # Ensure ES connectivity, as SearchIndexBackend.index_exists? swallows internal errors.
    bundle exec rails r "SearchIndexBackend.version"

    if bundle exec rails r "SearchIndexBackend.index_exists?('Ticket') || exit(1)"
    then
      echo "Elasticsearch index exists, no automatic reindexing is needed."
    else
      echo "Elasticsearch index does not exist yet, create it now…"
      bundle exec rake zammad:searchindex:rebuild
    fi
  {{ end }}

    echo "elasticsearch init complete :)"
{{ end }}
{{ if include "zammad.s3.initialisation" . }}
  s3-init: |-
    #!/bin/bash
    set -e

    # Unlike the former minio subchart (defaultBuckets), the rustfs chart does not
    # provision buckets, and Zammad never creates the bucket either - it only ever
    # reads from it. Create it here so that enabling the S3 storage provider works
    # out of the box. Reads its configuration from S3_URL via Zammad's own S3
    # provider, so it always targets the same endpoint and bucket as Zammad does.
    bundle exec rails r - <<'RUBY'
      require 'aws-sdk-s3'

      bucket = Store::Provider::S3::Config.bucket
      client = Store::Provider::S3.client

      attempts = 0

      begin
        client.head_bucket(bucket: bucket)
        puts "S3 bucket '#{bucket}' already exists."
      rescue Aws::S3::Errors::NotFound, Aws::S3::Errors::NoSuchBucket
        puts "S3 bucket '#{bucket}' does not exist yet, creating it…"
        client.create_bucket(bucket: bucket)
      rescue Seahorse::Client::NetworkingError => e
        # A fresh install races the rustfs pod's startup; retry instead of
        # crash-looping the whole init job pod.
        attempts += 1
        raise if attempts > 30

        puts "S3 service not reachable yet (#{e.message}), retrying in 5s…"
        sleep 5
        retry
      end
    RUBY

    echo "s3 init complete :)"
{{ end }}
