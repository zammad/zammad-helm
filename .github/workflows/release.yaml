name: Release Charts

permissions: read-all

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write # to push chart release and create a release (helm/chart-releaser-action)
      packages: write # needed for ghcr access
      id-token: write # needed for keyless signing
      attestations: write # to create the build provenance attestation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        id: chart-releaser
        uses: helm/chart-releaser-action@v1.9.0
        env:
          CR_GENERATE_RELEASE_NOTES: true
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          # Registry credentials for `cr push`, read from the environment so
          # the token isn't passed on the command line.
          CR_USERNAME: "${{ github.actor }}"
          CR_PASSWORD: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: .
          # Publish to the OCI registry only. This skips the gh-pages index
          # update; the GitHub release is still created, as chart-releaser
          # uses its tag to detect changed charts.
          skip_upload: true
          # Lets a rerun recover from a failed OCI push: the existing GitHub
          # release is skipped and only missing chart versions are pushed.
          skip_existing: true
          oci_registry_url: "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Set up Helm
        if: steps.chart-releaser.outputs.chart_version != ''
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Resolve chart digest
        id: chart
        if: steps.chart-releaser.outputs.chart_version != ''
        env:
          # The packaged chart identity, e.g. "zammad-21.1.2". This and the steps below assume
          # that only the zammad chart is released; with more charts, this becomes a list.
          CHART: ${{ steps.chart-releaser.outputs.chart_version }}
          CHART_REF: "oci://ghcr.io/${{ github.repository_owner }}/charts/zammad"
        run: |
          digest=$(helm pull "$CHART_REF" --version "${CHART#zammad-}" --destination "$RUNNER_TEMP" \
            | awk '/^Digest:/ { print $2 }')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # attest-build-provenance pushes the attestation with the Docker credentials.
      - name: Log in to GitHub Container Registry
        if: steps.chart-releaser.outputs.chart_version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        if: steps.chart-releaser.outputs.chart_version != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: "ghcr.io/${{ github.repository_owner }}/charts/zammad"
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
          # Needs the artifact-metadata permission, which the actionlint in super-linter v7 rejects.
          create-storage-record: false
