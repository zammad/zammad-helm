---
name: "Update Zammad version and dependency charts (patch and minor only)"

sources:
  zammad:
    name: zammad
    kind: dockerimage
    spec:
      image: "zammad/zammad-docker-compose"
      architecture: "linux/amd64"
      tagfilter: "^7\\.1\\.\\d-\\d{4}"
  alpine:
    name: alpine
    kind: dockerimage
    spec:
      image: "alpine"
      architecture: "linux/amd64"
      versionfilter:
        pattern: '3.x.x'
        kind: semver
  elasticsearch:
    name: elasticsearch
    kind: helmchart
    spec:
      url: https://helm.elastic.co
      name: eck-elasticsearch
      # Patch level only: this subchart provides the Elasticsearch version (which we do not
      #   pin, see values.yaml) and it may change the Elasticsearch minor or major version in
      #   a chart minor release, as the chart itself stays on 0.x. Chart patches only ever
      #   carry Elasticsearch patch updates.
      #   To perform a minor update, raise the pattern below and check that the ECK operator
      #   installed in the cluster (a prerequisite outside of this chart, see README) supports
      #   the resulting Elasticsearch version.
      versionfilter:
        pattern: "0.20.x"
  # Disabled while the subchart is pinned to a 1.0.0 release candidate: a semver
  #   filter would not match prereleases anyway. Enable this together with the
  #   corresponding target below once Chart.yaml pins the 1.0.0 GA release.
  # rustfs:
  #   name: rustfs
  #   kind: helmchart
  #   spec:
  #     url: https://charts.rustfs.com
  #     name: rustfs
  #     versionfilter:
  #       pattern: "1.x.x"
  memcached:
    name: memcached
    kind: helmchart
    spec:
      url: oci://ghcr.io/cloudpirates-io/helm-charts
      name: memcached
      versionfilter:
        pattern: "0.x.x"
  postgres:
    name: postgres
    kind: helmchart
    spec:
      url: oci://ghcr.io/cloudpirates-io/helm-charts
      name: postgres
      # Patch level only: this subchart may change the PostgreSQL major version in a minor release.
      #   To perform such an update, migrate the data via dump/restore, or add a pgautoupgrade init
      #   container as sketched in the subchart's values.yaml.
      versionfilter:
        pattern: "0.19.x"
  redis:
    name: redis
    kind: helmchart
    spec:
      url: oci://ghcr.io/cloudpirates-io/helm-charts
      name: redis
      versionfilter:
        pattern: "0.x.x"
  helm-version:
    name: helm-version
    kind: gittag
    spec:
      url: https://github.com/helm/helm.git
      versionfilter:
        kind: semver
  kubeconform-version:
    name: kubeconform-version
    kind: gittag
    spec:
      url: https://github.com/yannh/kubeconform.git
      versionfilter:
        kind: semver

conditions: {}

targets:
  zammad:
    name: zammad
    kind: helmchart
    sourceid: zammad
    # {{ if .github.enabled }}
    scmid: zammad-helm
    # {{ end }}
    spec:
      name: "zammad"
      file: "Chart.yaml"
      key: "$.appVersion"
      versionincrement: patch
  alpine:
    name: alpine
    kind: file
    sourceid: alpine
    # {{ if .github.enabled }}
    scmid: zammad-helm
    # {{ end }}
    spec:
      file: zammad/values.yaml
      matchpattern: '        tag: "\d+\.\d+\.\d+"'
      replacepattern: '        tag: "{{ source `alpine` }}"'
  elasticsearch:
    name: elasticsearch
    kind: helmchart
    sourceid: elasticsearch
    # {{ if .github.enabled }}
    scmid: zammad-helm
    # {{ end }}
    spec:
      name: "zammad"
      file: "Chart.yaml"
      key: "$.dependencies[0].version"
      versionincrement: patch
  # See the commented out rustfs source above.
  # rustfs:
  #   name: rustfs
  #   kind: helmchart
  #   sourceid: rustfs
  #   # {{ if .github.enabled }}
  #   scmid: zammad-helm
  #   # {{ end }}
  #   spec:
  #     name: "zammad"
  #     file: "Chart.yaml"
  #     key: "$.dependencies[1].version"
  #     versionincrement: patch
  memcached:
    name: memcached
    kind: helmchart
    sourceid: memcached
    # {{ if .github.enabled }}
    scmid: zammad-helm
    # {{ end }}
    spec:
      name: "zammad"
      file: "Chart.yaml"
      key: "$.dependencies[2].version"
      versionincrement: patch
  postgres:
    name: postgres
    kind: helmchart
    sourceid: postgres
    # {{ if .github.enabled }}
    scmid: zammad-helm
    # {{ end }}
    spec:
      name: "zammad"
      file: "Chart.yaml"
      key: "$.dependencies[3].version"
      versionincrement: patch
  redis:
    name: redis
    kind: helmchart
    sourceid: redis
    # {{ if .github.enabled }}
    scmid: zammad-helm
    # {{ end }}
    spec:
      name: "zammad"
      file: "Chart.yaml"
      key: "$.dependencies[4].version"
      versionincrement: patch
  helm-version-ci:
    name: helm-version-ci
    kind: yaml
    sourceid: helm-version
    # {{ if .github.enabled }}
    scmid: zammad-helm
    # {{ end }}
    spec:
      file: .github/workflows/ci.yaml
      key: "$.env.helm-version"
  helm-version-release:
    name: helm-version-release
    kind: yaml
    sourceid: helm-version
    # {{ if .github.enabled }}
    scmid: zammad-helm
    # {{ end }}
    spec:
      file: .github/workflows/release.yaml
      key: "$.env.helm-version"
  kubeconform-version-ci:
    name: kubeconform-version
    kind: yaml
    sourceid: kubeconform-version
    # {{ if .github.enabled }}
    scmid: zammad-helm
    # {{ end }}
    spec:
      file: .github/workflows/ci.yaml
      key: "$.env.kubeconform-version"
# {{ if .github.enabled }}
scms:
  zammad-helm:
    kind: "github"
    spec:
      owner: "zammad"
      repository: "zammad-helm"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      username: '{{ requiredEnv "UPDATECLI_GITHUB_ACTOR" }}'
      branch: "main"

actions:
  github:
    kind: github/pullrequest
    scmid: zammad-helm
    spec:
      automerge: false
      title: "Patch-level image updates"
      assignees:
        - mgruner
      labels:
        - "dependencies"
# {{ end }}